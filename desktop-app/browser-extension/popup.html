<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾集采集助手</title><link rel="stylesheet" href="popup.css"><script src="utils.js" defer></script><script src="popup.js" defer></script></head><body>
<header><div><h1>留给下一次创作</h1><p>把眼前的好东西，收进拾集。</p></div><span id="connection" role="status">未连接</span></header>
<main><button id="save">收藏当前网页<span>同时保存选中文字</span></button><button class="secondary" id="screenshot">收藏网页和截图</button><p class="hint">图片或链接：右键 → 收藏到拾集</p><div id="status" role="status" aria-live="polite"></div><div class="open-row"><a id="open-app" href="shiji://library">打开桌面 App</a><a id="open" href="http://127.0.0.1:8782/" target="_blank">网页管理</a></div><section class="outbox" aria-labelledby="outbox-heading"><h2 id="outbox-heading" tabindex="-1">待发送 <span id="outbox-count" aria-live="polite">0</span></h2><div id="outbox-list"><p class="hint">正在读取…</p></div><p class="hint">待发送内容只保存在当前浏览器。移除记录不撤销 App 中已保存的收藏。</p></section></main>
<details id="settings"><summary>连接 App</summary><form id="settings-form"><label>本地 App 地址<input id="base" type="url" value="http://127.0.0.1:8782" required></label><label>配对码<input id="token" type="password" autocomplete="off" required placeholder="从 App 的扩展配对中复制"></label><button class="secondary" type="submit">保存并检查连接</button></form><p class="hint">连接过 App 后，离线时也能暂存收藏。打开 App 并保持浏览器运行，会自动重试。更换配对不会转发旧记录。卸载扩展会删除未发送内容。</p></details></body></html>
