name: Stable Beta checks
on:
  pull_request:
  push:
    branches: [main, "feat/shiji-v5-*"]
permissions:
  contents: read
jobs:
  python-node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - name: Install development test dependencies
        working-directory: desktop-app
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Python portable real-business regression
        working-directory: desktop-app
        run: python tests/run-ci.py --suite portable
      - name: Node DOM and motion regression
        working-directory: desktop-app
        run: npm test
  native:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select installed modern Swift SDK
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Python compiled Swift and WebKit contracts
        working-directory: desktop-app
        run: python tests/run-ci.py --suite native
      - name: Swift core and desktop exchange
        run: python mobile-app/Tests/run.py
      - name: Swift HTTPS sync with disposable certificates
        run: python mobile-app/Tests/sync_integration.py
