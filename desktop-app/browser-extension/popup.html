<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>拾集采集助手</title><link rel="stylesheet" href="popup.css"><script src="utils.js" defer></script><script src="popup.js" defer></script></head><body>
<header><div><h1>留给下一次创作</h1><p>把眼前的好东西，收进拾集。</p></div><span id="connection" role="status">未连接</span></header>
<main><button id="save">收藏当前网页<span>同时保存选中文字</span></button><button class="secondary" id="screenshot">收藏网页和截图</button><p class="hint">图片或链接：右键 → 收藏到拾集</p><div id="status" role="status" aria-live="polite"></div><div class="open-row"><a id="open-app" href="shiji://library">打开桌面 App</a><a id="open" href="http://127.0.0.1:8782/" target="_blank">网页管理</a></div></main>
<details id="settings"><summary>连接 App</summary><form id="settings-form"><label>本地 App 地址<input id="base" type="url" value="http://127.0.0.1:8782" required></label><label>配对码<input id="token" type="password" autocomplete="off" required placeholder="从 App 的扩展配对中复制"></label><button class="secondary" type="submit">保存并检查连接</button></form><p class="hint">App 退出后无法采集；重新打开即可继续。配对码只保存在本机。</p></details></body></html>
